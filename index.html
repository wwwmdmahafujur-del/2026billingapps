<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bondon Internet Service</title>
<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin:0; padding:0; }
    .container { max-width: 1200px; margin: 30px auto; padding: 25px; background: #fff; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.05); }
    
    /* Header Style */
    h1 { 
        text-align:center; 
        color: #fff; 
        background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .header-info {
        text-align: center; margin-bottom: 30px; padding: 15px; background: linear-gradient(to right, #e0f7fa, #b2ebf2);
        border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.07); border: 1px solid #80deea;
    }
    .header-info p { margin: 5px 0; font-size: 16px; color: #004d40; font-weight: 500; }
    .header-info i { margin-right: 10px; color: #00796b; }
    h3 { color: #2c3e50; border-left: 5px solid #3498db; padding-left: 10px; margin-top: 30px;}

    /* Dashboard */
    .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; } /* Changed to 4 columns */
    .card { padding: 20px; border-radius: 12px; text-align: center; color: white; position: relative; overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .card h4 { margin: 0; font-size: 14px; text-transform: uppercase; opacity: 0.9; letter-spacing: 1px; }
    .card .val { font-size: 28px; font-weight: bold; margin-top: 10px; }
    .card i { font-size: 40px; position: absolute; right: 10px; bottom: 10px; opacity: 0.2; }
    /* Keeping original styles but overriding in HTML for image match */
    .c-purple { background: linear-gradient(135deg, #7f00ff 0%, #e100ff 100%); } /* Darker Purple for TOTAL CUSTOMERS */
    .c-green { background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%); } /* Darker Green for TOTAL COLLECTED */
    .c-red { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); } /* Darker Red for TOTAL DUE */
    .c-orange { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); } /* New style for TOTAL BILL AMOUNT */

    /* Forms & Buttons */
    .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    input, select { padding: 12px; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; background: #f9f9f9; transition: 0.3s; }
    input:focus, select:focus { border-color: #3498db; outline: none; background: #fff; }
    button { padding: 12px; cursor:pointer; background:#34495e; color:#fff; border:none; border-radius:6px; font-size: 14px; transition: 0.3s; width: 100%; font-weight: 600; }
    button:hover { opacity: 0.9; transform: scale(1.02); }
    button.add-btn { background: linear-gradient(to right, #11998e, #38ef7d); grid-column: span 4; font-size: 16px; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); } 
    .header-btns { float: right; display: flex; gap: 10px; }
    button.excel { background: #f39c12; width: auto; padding: 8px 20px; }
    button.import { background: #8e44ad; width: auto; padding: 8px 20px; }
    
    /* Tables */
    table { width:100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    th { background: #34495e; color: #fff; padding: 15px; text-align: center; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
    td { padding: 12px; text-align:center; vertical-align: middle; border-bottom: 1px solid #eee; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    tr:hover { background-color: #e8f4f8; }
    .total-row { background-color: #ecf0f1; font-weight: bold; font-size: 16px; color: #2c3e50; }

    /* Actions & Controls */
    .action-cell { white-space: nowrap; }
    .btn-sm { width: auto; display: inline-block; padding: 6px 10px; margin: 0 2px; font-size: 11px; border-radius: 20px; text-transform: uppercase; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-collect { background: #2ecc71; }
    .btn-pdf { background: #3498db; }
    .btn-edit { background: #e67e22; }
    .btn-del { background: #e74c3c; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; background: #f1f2f6; padding: 15px; border-radius: 8px; }
    .search-bar { flex: 2; min-width: 200px; border: 1px solid #ccc; }
    .filter-select { flex: 1; min-width: 120px; }
    .btn-show-all { background: #2c3e50; color: white; flex: 0.5; min-width: 100px; }

    /* Pagination */
    .pagination { margin-top: 25px; text-align:center; }
    .pagination button { width: 35px; height: 35px; margin: 0 5px; padding: 0; border-radius: 50%; background: #fff; color: #333; border: 1px solid #ddd; display: inline-flex; align-items: center; justify-content: center; }
    .pagination button.active { background: #3498db; color: #fff; border-color: #3498db; }

    /* Expense Summary */
    .summary-box { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef;}
    .summary-box h4 { margin-top: 0; color: #343a40; }
    .summary-item { font-size: 16px; font-weight: bold; color: #495057; }
    .summary-item span { color: #007bff; }
    .category-summary ul { list-style: none; padding: 0; margin: 0; }
    .category-summary li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #dee2e6; }
    .category-summary li:last-child { border-bottom: none; }

    /* Modal Styles for Category Management */
    .modal {
        display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
        overflow: auto; background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
        background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888;
        width: 80%; max-width: 500px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
    .close-btn:hover, .close-btn:focus { color: #000; text-decoration: none; cursor: pointer; }
    .category-list li {
        display: flex; justify-content: space-between; align-items: center; padding: 10px;
        border-bottom: 1px solid #eee;
    }
    .category-list li:last-child { border-bottom: none; }
    .category-action-btns { display: flex; gap: 5px; }
    .modal-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .modal-input-group input { flex-grow: 1; }
    .modal-input-group button { width: auto; padding: 10px 15px; }
</style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-wifi"></i> Bondon Internet Service</h1>
    <div class="header-info">
        <p><i class="fas fa-user-tie"></i> <strong>মহা পরিচালকঃ</strong> মোঃ মাহাফুজুর রহমান (রাজিব)</p>
        <p><i class="fas fa-mobile-alt"></i> <strong>মোবাইলঃ</strong> 01928-575794, 01826-191827</p>
    </div>

    <!-- DASHBOARD: MODIFIED to match the image (4 columns, new labels/metrics) -->
    <div class="dashboard">
        <!-- 1. TOTAL CUSTOMERS -->
        <div class="card c-purple"><h4>TOTAL CUSTOMERS</h4><div class="val" id="totalCust">0</div><i class="fas fa-users"></i></div>
        <!-- 2. TOTAL BILL AMOUNT (Monthly) -->
        <div class="card c-orange"><h4>TOTAL BILL AMOUNT</h4><div class="val" id="totalBillAmount">0</div><i class="fas fa-file-invoice-dollar"></i></div>
        <!-- 3. TOTAL COLLECTED (Monthly) -->
        <div class="card c-green"><h4>TOTAL COLLECTED</h4><div class="val" id="totalCollectedMonth">0</div><i class="fas fa-check-circle"></i></div>
        <!-- 4. TOTAL DUE (Monthly) -->
        <div class="card c-red"><h4>TOTAL DUE</h4><div class="val" id="totalDue">0</div><i class="fas fa-exclamation-triangle"></i></div>
        
        <!-- HIDDEN OLD METRICS (Keeping IDs for JS consistency with Expense section if needed) -->
        <div id="totalPaid" style="display:none;">0</div>
        <div id="totalExpense" style="display:none;">0</div>
        <div id="netProfit" style="display:none;">0</div>
        <div id="monthlyDueAmount" style="display:none;">0</div>
        <div id="monthlyDueCustomers" style="display:none;">0</div>
    </div>
    <!-- END MODIFIED DASHBOARD -->

    <!-- CUSTOMER SECTION -->
    <h3><i class="fas fa-user-plus"></i> Add / Edit Customer</h3>
    <!-- ... rest of the customer section is unchanged ... -->
    <div class="input-group" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <input type="text" id="name" placeholder="Customer Name"><input type="text" id="mobile" placeholder="Mobile Number">
        <input type="text" id="userId" placeholder="User ID"><input type="number" id="plan" placeholder="Monthly Bill">
        <input type="date" id="connDate" required>
    </div>
    <button class="add-btn" id="mainBtn" onclick="handleCustomerSubmit()">+ Add Customer</button>

    <div style="margin-top: 40px; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0; border:none;"><i class="fas fa-list"></i> Customer List</h3>
        <div class="header-btns">
            <input type="file" id="importFile" style="display:none" accept=".xlsx, .xls" onchange="handleFileImport(event)">
            <button class="import" onclick="document.getElementById('importFile').click()"><i class="fas fa-file-import"></i> Import</button>
            <button class="excel" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Export</button>
        </div>
    </div>
    <div class="controls" style="margin-top: 15px;">
        <!-- Added renderAll(true) to reset page on search/filter change -->
        <input class="search-bar" type="text" id="search" placeholder="Search Customers..." oninput="renderAll(true)">
        <select class="filter-select" id="yearFilter" onchange="renderAll(true)"></select>
        <select class="filter-select" id="monthFilter" onchange="renderAll(true)">
            <option value="">-- Select Month --</option>
            <option value="01">January</option><option value="02">February</option><option value="03">March</option><option value="04">April</option>
            <option value="05">May</option><option value="06">June</option><option value="07">July</option><option value="08">August</option>
            <option value="09">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
        <select class="filter-select" id="statusFilter" onchange="renderAll(true)">
            <option value="all">স্ট্যাটাস: সকল</option><option value="paid">পরিশোধিত</option><option value="due">বকেয়া</option>
        </select>
        <button class="btn-show-all" id="showAllBtn" onclick="toggleShowAll()">Show All</button>
    </div>
    <table id="customerTable"></table>
    <div class="pagination" id="pagination"></div>

    <!-- EXPENSE SECTION -->
    <div id="expense-section" style="margin-top: 50px;">
        <!-- ... rest of the expense section is unchanged ... -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin:0; border:none;"><i class="fas fa-calculator"></i> খরচের হিসাব (Expense Tracking)</h3>
            <button class="excel" style="background: #e67e22; width: auto; padding: 8px 20px;" onclick="openCategoryModal()"><i class="fas fa-cog"></i> Manage Categories</button>
        </div>
        <div class="input-group">
            <input type="text" id="expenseDesc" placeholder="খরচের বিবরণ"><input type="number" id="expenseAmount" placeholder="টাকার পরিমাণ">
            <select id="expenseCategory"></select> <!-- Populated by JS -->
            <input type="date" id="expenseDate">
        </div>
        <button class="add-btn" id="expenseBtn" style="background: #3498db;" onclick="handleExpenseSubmit()">+ খরচ যোগ করুন</button>

        <div class="controls" style="margin-top: 20px;">
            <!-- Added renderAll() without true as it doesn't use pagination -->
            <input class="search-bar" type="text" id="expenseSearch" placeholder="খরচ খুঁজুন (বিবরণ বা ক্যাটেগরি)..." oninput="renderAll()">
        </div>
        <table id="expenseTable"></table>
        <div id="expenseSummary"></div>
    </div>
</div>

<!-- Category Management Modal (Unchanged) -->
<div id="categoryModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeCategoryModal()">&times;</span>
        <h3 style="border-left: 5px solid #e67e22; padding-left: 10px;">Manage Expense Categories</h3>
        
        <!-- Add Category Form -->
        <div class="modal-input-group">
            <input type="text" id="newCategoryInput" placeholder="New Category Name">
            <button class="btn-collect" id="addCategoryBtn" onclick="addCategory()">Add Category</button>
        </div>

        <!-- Category List -->
        <ul id="categoryList" class="category-list">
            <!-- Categories will be rendered here by JS -->
        </ul>
    </div>
</div>
<!-- End Modal -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
    let customers = JSON.parse(localStorage.getItem('customers') || '[]');
    let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
    let categories = JSON.parse(localStorage.getItem('expenseCategories')) || [
        "লাইন মেরামত", "কর্মচারীর বেতন", "অফিস ভাড়া", "বিদ্যুৎ বিল", "গাড়ি ভাড়া", "সকালে নাস্তা", "দুপুরে খাবার", "অন্যান্য"
    ]; // Custom Categories initialized
    
    let currentPage = 1, editIndex = -1, editExpenseIndex = -1, isShowAll = false;
    const rowsPerPage = 15;
    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    const yearSelect = document.getElementById('yearFilter');
    const currentYear = new Date().getFullYear();
    for (let i = currentYear + 1; i >= currentYear - 5; i--) {
        yearSelect.add(new Option(i, i));
    }
    yearSelect.value = currentYear;

    // Format money using Bengali locale for better readability of large numbers
    const formatMoney = (amount) => Number(amount).toLocaleString('bn-BD', { style: 'decimal', minimumFractionDigits: 0, maximumFractionDigits: 0 });

    // UPDATED FUNCTION: Added resetPage parameter
    function renderAll(resetPage = false) {
        if (resetPage) currentPage = 1; // Reset page if search or filter changes
        updateCategoryDropdown();
        renderCustomerTable();
        renderExpenseSection();
        updateDashboard();
    }
    // UPDATED FUNCTION: Fixed logic for pagination/show all switch
    function toggleShowAll() {
        isShowAll = !isShowAll;
        document.getElementById('showAllBtn').innerText = isShowAll ? "Show Pages" : "Show All";
        currentPage = 1; // Always reset page to 1 when switching modes
        renderAll();
    }
    function saveAndRender() {
        localStorage.setItem('customers', JSON.stringify(customers));
        localStorage.setItem('expenses', JSON.stringify(expenses));
        localStorage.setItem('expenseCategories', JSON.stringify(categories)); 
        renderAll();
    }

    // Category Management Functions (Unchanged)
    function saveCategories() {
        localStorage.setItem('expenseCategories', JSON.stringify(categories));
        updateCategoryDropdown();
        renderCategoryList();
    }
    function updateCategoryDropdown() {
        const select = document.getElementById('expenseCategory');
        select.innerHTML = '';
        categories.forEach(cat => {
            select.add(new Option(cat, cat));
        });
    }
    function openCategoryModal() {
        document.getElementById('categoryModal').style.display = 'block';
        renderCategoryList();
    }
    function closeCategoryModal() {
        document.getElementById('categoryModal').style.display = 'none';
        document.getElementById('newCategoryInput').value = '';
        document.getElementById('addCategoryBtn').innerText = 'Add Category';
        document.getElementById('addCategoryBtn').onclick = addCategory;
        document.getElementById('addCategoryBtn').classList.remove('btn-edit');
        document.getElementById('addCategoryBtn').classList.add('btn-collect');
    }
    function renderCategoryList() {
        const ul = document.getElementById('categoryList');
        ul.innerHTML = '';
        categories.forEach((cat, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${cat}</span>
                <div class="category-action-btns">
                    <button class="btn-sm btn-edit" onclick="prepareEditCategory(${index}, '${cat.replace(/'/g, "\\'")}')"><i class="fas fa-edit"></i> Edit</button>
                    <button class="btn-sm btn-del" onclick="deleteCategory(${index})"><i class="fas fa-trash"></i> Delete</button>
                </div>
            `;
            ul.appendChild(li);
        });
    }
    function addCategory() {
        const input = document.getElementById('newCategoryInput');
        const newCat = input.value.trim();
        if (newCat && !categories.includes(newCat)) {
            categories.push(newCat);
            saveCategories();
            input.value = '';
        }
    }
    function prepareEditCategory(index, catName) {
        const input = document.getElementById('newCategoryInput');
        const btn = document.getElementById('addCategoryBtn');
        input.value = catName;
        btn.innerText = 'Update Category';
        btn.onclick = () => editCategory(index);
        btn.classList.remove('btn-collect');
        btn.classList.add('btn-edit');
    }
    function editCategory(index) {
        const input = document.getElementById('newCategoryInput');
        const updatedCat = input.value.trim();
        if (updatedCat && !categories.includes(updatedCat)) {
            categories[index] = updatedCat;
            saveCategories();
            closeCategoryModal();
        } else if (updatedCat === categories[index]) {
             closeCategoryModal(); // No change
        } else {
            alert('Category already exists or is empty!');
        }
    }
    function deleteCategory(index) {
        if (confirm(`Are you sure you want to delete the category: ${categories[index]}? Expenses already tagged with this category will not be affected.`)) {
            categories.splice(index, 1);
            saveCategories();
        }
    }
    // End Category Management Functions
    
    // Dashboard: MODIFIED to calculate and display Total Bill Amount, Total Collected (Monthly), and Total Due (Monthly)
    function updateDashboard() {
        const year = document.getElementById('yearFilter').value;
        const month = document.getElementById('monthFilter').value || (new Date().getMonth() + 1).toString().padStart(2, '0');
        
        // New Dashboard Metrics (Monthly Focus)
        let totalBillAmount = 0;
        let totalCollectedMonth = 0;
        let totalDueMonth = 0;
        
        // Old Yearly Metrics (Kept for expense section / yearly view)
        let yearlyPaid = 0;
        let totalExpense = 0;

        customers.forEach(c => {
            const plan = Number(c.plan) || 0;
            const paymentsYear = c.payments?.[year] || {};
            
            // 1. Calculate Monthly Bill/Collection/Due for the selected month/year
            const connDate = new Date(c.connDate);
            const selectedDate = new Date(year, month - 1, 1);
            
            // Only include customers whose connection date is before or in the selected month
            if (selectedDate >= new Date(connDate.getFullYear(), connDate.getMonth(), 1)) {
                
                totalBillAmount += plan; // Total bill for this month
                const isPaid = paymentsYear[month];

                if (isPaid === true) {
                    totalCollectedMonth += plan;
                } else if (isPaid === false) {
                    totalDueMonth += plan;
                }
            }

            // 2. Old Yearly Collection Calculation (Keeping this logic for yearly reports if needed)
            const paidMonths = Object.values(paymentsYear).filter(s => s === true).length;
            yearlyPaid += (plan * paidMonths);
        });

        // 3. Calculate Yearly Expense
        totalExpense = expenses.filter(e => new Date(e.date).getFullYear() == year)
                               .reduce((sum, e) => sum + Number(e.amount), 0);
        
        // Update Dashboard Display (New 4-card structure)
        document.getElementById('totalCust').innerText = customers.length;
        document.getElementById('totalBillAmount').innerText = formatMoney(totalBillAmount);
        document.getElementById('totalCollectedMonth').innerText = formatMoney(totalCollectedMonth);
        document.getElementById('totalDue').innerText = formatMoney(totalDueMonth);

        // Update Hidden Old Metrics (for yearly view if needed later, though not displayed)
        document.getElementById('totalPaid').innerText = formatMoney(yearlyPaid);
        document.getElementById('totalExpense').innerText = formatMoney(totalExpense);
        document.getElementById('netProfit').innerText = formatMoney(yearlyPaid - totalExpense);
        document.getElementById('monthlyDueAmount').innerText = formatMoney(totalDueMonth); // Reusing due amount for the hidden due field
        document.getElementById('monthlyDueCustomers').innerText = customers.filter(c => c.payments?.[year]?.[month] === false).length;
    }
    // End Modified Dashboard
    
    // Customer Functions
    function renderCustomerTable() {
        const table = document.getElementById('customerTable');
        const search = document.getElementById('search').value.toLowerCase();
        const year = document.getElementById('yearFilter').value;
        const month = document.getElementById('monthFilter').value || (new Date().getMonth() + 1).toString().padStart(2, '0');
        const status = document.getElementById('statusFilter').value;
        const monthName = MONTH_NAMES[parseInt(month) - 1];

        const filtered = customers.filter(c => {
            const connDate = new Date(c.connDate);
            if (connDate.getFullYear() > year || (connDate.getFullYear() == year && connDate.getMonth() + 1 > month)) return false;
            const matchesSearch = (c.name || '').toLowerCase().includes(search) || (c.mobile || '').includes(search) || (c.userId || '').toLowerCase().includes(search);
            const paymentStatus = c.payments?.[year]?.[month];
            const matchesStatus = status === 'all' || (status === 'paid' && paymentStatus) || (status === 'due' && !paymentStatus);
            return matchesSearch && matchesStatus;
        });

        let paginated;
        if (isShowAll) {
            paginated = filtered;
            document.getElementById('pagination').style.display = 'none';
        } else {
            const totalPages = Math.ceil(filtered.length / rowsPerPage);
            // Ensure currentPage is valid after filtering
            currentPage = Math.min(currentPage, totalPages || 1);
            const start = (currentPage - 1) * rowsPerPage;
            paginated = filtered.slice(start, start + rowsPerPage);
            document.getElementById('pagination').style.display = 'block';
            renderPagination(totalPages, currentPage);
        }

        let html = `<thead><tr><th>Name</th><th>User ID</th><th>Mobile</th><th>Conn. Date</th><th>Bill</th><th>Status (${monthName})</th><th style="width: 220px;">Actions</th></tr></thead><tbody>`;
        if (paginated.length === 0) {
            html += `<tr><td colspan="7" style="padding:20px; color:#777;">No customers found</td></tr>`;
        } else {
            paginated.forEach(c => {
                const index = customers.indexOf(c);
                const isPaid = c.payments?.[year]?.[month] || false;
                html += `<tr>
                    <td style="text-align:left; font-weight:bold; color:#2c3e50;">${c.name}</td>
                    <td>${c.userId || '-'}</td><td>${c.mobile || '-'}</td><td>${c.connDate || '-'}</td><td>${formatMoney(c.plan)}</td>
                    <td><span style="padding:4px 8px; border-radius:4px; background:${isPaid ? '#d4edda':'#f8d7da'}; color:${isPaid ? '#155724':'#721c24'}; font-weight:bold;">${isPaid ? 'Paid':'Due'}</span></td>
                    <td class="action-cell">
                        <button class="btn-sm btn-collect" onclick="toggleStatus(${index})"><i class="fas fa-hand-holding-usd"></i> ${isPaid ? 'Unpaid' : 'Pay'}</button>
                        <button class="btn-sm btn-edit" onclick="editCustomer(${index})"><i class="fas fa-edit"></i></button>
                        <button class="btn-sm btn-pdf" onclick="generatePDF(${index})"><i class="fas fa-file-pdf"></i></button>
                        <button class="btn-sm btn-del" onclick="deleteCustomer(${index})"><i class="fas fa-trash"></i></button>
                    </td></tr>`;
            });
        }
        table.innerHTML = html;
    }
    function renderPagination(totalPages, currentPage) {
        const pagDiv = document.getElementById('pagination');
        pagDiv.innerHTML = '';
        for(let i=1; i<=totalPages; i++){
            const btn = document.createElement('button'); btn.innerText = i;
            if(i === currentPage) btn.classList.add('active');
            btn.onclick = () => { 
                window.currentPage = i; 
                renderCustomerTable(); // Calls renderCustomerTable directly
            };
            pagDiv.appendChild(btn);
        }
    }
    function handleCustomerSubmit() {
        const name = document.getElementById('name').value, mobile = document.getElementById('mobile').value, userId = document.getElementById('userId').value,
              plan = document.getElementById('plan').value, connDate = document.getElementById('connDate').value;
        if (!name || !plan || !connDate) { alert('Name, Bill Amount and Connection Date are required!'); return; }
        
        const date = new Date(connDate), connYear = date.getFullYear(), connMonth = date.getMonth() + 1;
        
        if (editIndex === -1) {
            const payments = { [connYear]: {} };
            for(let i=1; i<=12; i++) payments[connYear][String(i).padStart(2,'0')] = (connYear === currentYear && i < connMonth) ? null : false; 
            customers.push({ name, mobile, userId, plan, connDate, payments });
        } else {
            const c = customers[editIndex];
            c.name = name; c.mobile = mobile; c.userId = userId; c.plan = plan;
            if (c.connDate !== connDate) {
                // If connection date changes, reset payments for the new date's year
                c.connDate = connDate; c.payments = { [connYear]: {} };
                for(let i=1; i<=12; i++) c.payments[connYear][String(i).padStart(2,'0')] = (connYear === currentYear && i < connMonth) ? null : false;
            }
            editIndex = -1;
            document.getElementById('mainBtn').innerHTML = "+ Add Customer";
        }
        saveAndRender();
        ['name','mobile','userId','plan'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('connDate').valueAsDate = new Date();
    }
    function editCustomer(i) {
        const c = customers[i];
        document.getElementById('name').value = c.name; document.getElementById('mobile').value = c.mobile;
        document.getElementById('userId').value = c.userId; document.getElementById('plan').value = c.plan;
        document.getElementById('connDate').value = c.connDate;
        editIndex = i;
        document.getElementById('mainBtn').innerText = "Update Customer";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleStatus(index) {
        const year = document.getElementById('yearFilter').value;
        const month = document.getElementById('monthFilter').value || (new Date().getMonth() + 1).toString().padStart(2, '0');
        const customer = customers[index];
        if (!customer.payments) customer.payments = {};
        if (!customer.payments[year]) customer.payments[year] = {};

        // Check if payment is allowed (date after connection date) - basic check
        const connDate = new Date(customer.connDate);
        const selectedDate = new Date(year, month - 1, 1);
        if (selectedDate < new Date(connDate.getFullYear(), connDate.getMonth(), 1)) {
            alert("Payment for this month is not allowed as it is before the connection date.");
            return;
        }

        customer.payments[year][month] = !customer.payments[year][month];
        saveAndRender();
    }
    function deleteCustomer(i) { if (confirm('Delete customer?')) { customers.splice(i, 1); saveAndRender(); } }
    
    // Expense Functions (Unchanged)
    function renderExpenseSection() {
        const table = document.getElementById('expenseTable');
        const search = document.getElementById('expenseSearch').value.toLowerCase();
        const year = document.getElementById('yearFilter').value;
        const month = document.getElementById('monthFilter').value;
        
        const today = new Date().toISOString().split('T')[0];
        let totalToday = 0;
        let totalMonth = 0;
        let categoryTotals = {};
        
        const filteredExpenses = expenses.filter(e => {
            const expenseDate = new Date(e.date);
            const matchesYear = expenseDate.getFullYear() == year;
            if (!matchesYear) return false;

            const matchesSearch = (e.desc || '').toLowerCase().includes(search) || (e.category || '').toLowerCase().includes(search);
            const matchesMonth = !month || (expenseDate.getMonth() + 1).toString().padStart(2, '0') == month;

            if (e.date === today) totalToday += Number(e.amount);
            if (matchesMonth) {
                totalMonth += Number(e.amount);
                categoryTotals[e.category] = (categoryTotals[e.category] || 0) + Number(e.amount);
            }
            return matchesSearch && matchesMonth;
        }).sort((a,b) => new Date(b.date) - new Date(a.date));

        let html = `<thead><tr><th style="text-align:left;">Description</th><th>Category</th><th>Amount</th><th>Date</th><th style="width:120px;">Action</th></tr></thead><tbody>`;
        if (filteredExpenses.length === 0) {
            html += `<tr><td colspan="5" style="padding:20px; color:#777;">No expenses found</td></tr>`;
        } else {
            filteredExpenses.forEach(exp => {
                const index = expenses.indexOf(exp);
                html += `<tr>
                    <td style="text-align:left;">${exp.desc}</td><td>${exp.category}</td><td>${formatMoney(exp.amount)}</td><td>${exp.date}</td>
                    <td class="action-cell">
                        <button class="btn-sm btn-edit" onclick="editExpense(${index})"><i class="fas fa-edit"></i></button>
                        <button class="btn-sm btn-del" onclick="deleteExpense(${index})"><i class="fas fa-trash"></i></button>
                    </td></tr>`;
            });
        }
        table.innerHTML = html;
        
        let summaryHtml = `<div class="summary-box">
            <div><h4>রিপোর্ট</h4>
                <p class="summary-item">আজকের খরচ: <span>${formatMoney(totalToday)}</span></p>
                <p class="summary-item">মাসের মোট খরচ: <span>${formatMoney(totalMonth)}</span></p>
            </div>
            <div class="category-summary"><h4>ক্যাটেগরি অনুযায়ী খরচ</h4><ul>`;
        const sortedCategories = Object.keys(categoryTotals).sort();
        if(sortedCategories.length > 0) {
            sortedCategories.forEach(category => {
                summaryHtml += `<li><span>${category}</span> <strong>${formatMoney(categoryTotals[category])}</strong></li>`;
            });
        } else {
            summaryHtml += `<li>No expenses this month</li>`;
        }
        summaryHtml += `</ul></div></div>`;
        document.getElementById('expenseSummary').innerHTML = summaryHtml;
    }
    function handleExpenseSubmit() {
        const desc = document.getElementById('expenseDesc').value, amount = document.getElementById('expenseAmount').value,
              category = document.getElementById('expenseCategory').value, date = document.getElementById('expenseDate').value;
        if (!desc || !amount || !date) { alert('Description, Amount and Date are required!'); return; }

        const expenseObj = { desc, amount, category, date };

        if (editExpenseIndex === -1) {
            expenses.push(expenseObj);
        } else {
            expenses[editExpenseIndex] = expenseObj;
            editExpenseIndex = -1;
            const btn = document.getElementById('expenseBtn');
            btn.innerText = "+ খরচ যোগ করুন";
            btn.style.background = "#3498db";
        }
        saveAndRender();
        ['expenseDesc', 'expenseAmount'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('expenseDate').valueAsDate = new Date();
    }
    function editExpense(i) {
        const exp = expenses[i];
        document.getElementById('expenseDesc').value = exp.desc;
        document.getElementById('expenseAmount').value = exp.amount;
        document.getElementById('expenseCategory').value = exp.category;
        document.getElementById('expenseDate').value = exp.date;
        editExpenseIndex = i;
        const btn = document.getElementById('expenseBtn');
        btn.innerText = "Update Expense";
        btn.style.background = "#e67e22";
        document.getElementById('expense-section').scrollIntoView({ behavior: 'smooth' });
    }
    function deleteExpense(i) { if (confirm('Delete this expense?')) { expenses.splice(i, 1); saveAndRender(); } }

    // Import/Export/PDF Functions (Unchanged)
    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.SheetNames[0];
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet], { header: 1 });

            const headers = json[0];
            const newCustomers = json.slice(1).map(row => {
                const connDateStr = row[4];
                const date = new Date(connDateStr);
                const connYear = date.getFullYear();
                const connMonth = date.getMonth() + 1;
                const payments = { [connYear]: {} };
                for(let i=1; i<=12; i++) payments[connYear][String(i).padStart(2,'0')] = (connYear === currentYear && i < connMonth) ? null : false;
                
                return {
                    name: row[0],
                    mobile: String(row[1] || ''),
                    userId: String(row[2] || ''),
                    plan: String(row[3] || '0'),
                    connDate: connDateStr,
                    payments: payments
                };
            }).filter(c => c.name && c.plan && c.connDate);

            if (newCustomers.length > 0) {
                customers = [...customers, ...newCustomers];
                saveAndRender();
                alert(`${newCustomers.length} customers imported successfully!`);
            } else {
                alert('No valid customer data found in the file.');
            }
        };
        reader.readAsArrayBuffer(file);
    }
    function exportExcel() {
        const data = customers.map(c => [
            c.name,
            c.mobile,
            c.userId,
            Number(c.plan),
            c.connDate,
        ]);
        data.unshift(["Name", "Mobile", "User ID", "Monthly Bill", "Connection Date"]);
        
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Customers");
        XLSX.writeFile(wb, `Bondon_Customer_List_${new Date().toLocaleDateString()}.xlsx`);
    }
    function generatePDF(i) {
        const c = customers[i];
        if (!c) return;

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.text("Bondon Internet Service - Customer Bill", 14, 22);

        doc.setFontSize(12);
        doc.text(`Name: ${c.name}`, 14, 35);
        doc.text(`Mobile: ${c.mobile}`, 14, 42);
        doc.text(`User ID: ${c.userId || '-'}`, 14, 49);
        doc.text(`Monthly Bill: ${formatMoney(c.plan)} Tk`, 14, 56);
        doc.text(`Connection Date: ${c.connDate}`, 14, 63);

        const tableData = [];
        const currentYearPayments = c.payments?.[document.getElementById('yearFilter').value] || {};
        
        for(let i=1; i<=12; i++) {
            const monthKey = String(i).padStart(2, '0');
            const status = currentYearPayments[monthKey];
            const statusText = status === true ? 'Paid' : (status === false ? 'Due' : 'N/A');
            tableData.push([
                MONTH_NAMES[i-1],
                statusText,
                status === true ? formatMoney(c.plan) : '0'
            ]);
        }

        doc.autoTable({
            startY: 75,
            head: [['Month', 'Status', 'Amount Paid']],
            body: tableData,
            styles: { fontSize: 10, cellPadding: 2, halign: 'center' },
            headStyles: { fillColor: [52, 73, 94] }
        });
        
        doc.save(`Bill_${c.name}_${document.getElementById('yearFilter').value}.pdf`);
    }
    // End Import/Export/PDF

    // Initial Load
    document.getElementById('connDate').valueAsDate = new Date();
    document.getElementById('expenseDate').valueAsDate = new Date();
    renderAll(); // Initial call without resetPage
</script>
